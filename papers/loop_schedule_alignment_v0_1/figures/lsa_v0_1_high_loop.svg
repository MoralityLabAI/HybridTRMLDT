<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">High-loop visit alignment and gradient scale</title>
<desc id="desc">Tied kappa peaks at R16 and then falls through R64 while tied maximum gradient norm rises above 100. Untied kappa and gradients remain near their controls.</desc>
