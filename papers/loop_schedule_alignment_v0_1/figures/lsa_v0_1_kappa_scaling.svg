<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
<title id="title">Visit-alignment scaling in MLP and mini Transformer loops</title>
<desc id="desc">Tied kappa grows with loop visits in both model families while untied controls remain nearly flat. The MLP R16 point falls below the v0 extrapolation.</desc>
<rect width="940" height="500" fill="#f3efe6"/>
<text x="52.0" y="42.0" text-anchor="start" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#18332c">Weight tying separates visit-alignment scaling</text>
<text x="52.0" y="68.0" text-anchor="start" font-family="Georgia, serif" font-size="14" font-weight="normal" fill="#65736d">Geometric mean across three seeds at 4,096 state-visit exposures</text>
