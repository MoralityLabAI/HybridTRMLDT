<text x="70.0" y="409.0" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="normal" fill="#65736d">0</text>
<line x1="80" y1="321.3" x2="460" y2="321.3" stroke="#d2cabd"/>
<text x="70.0" y="325.3" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="normal" fill="#65736d">1</text>
<line x1="80" y1="237.6" x2="460" y2="237.6" stroke="#d2cabd"/>
<text x="70.0" y="241.6" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="normal" fill="#65736d">2</text>
<line x1="80" y1="153.9" x2="460" y2="153.9" stroke="#d2cabd"/>
<text x="70.0" y="157.9" text-anchor="end" font-family="Consolas, monospace" font-size="11" font-weight="normal" fill="#65736d">3</text>
<line x1="80" y1="112" x2="80" y2="405" stroke="#18332c" stroke-width="2"/>
<line x1="80" y1="405" x2="460" y2="405" stroke="#18332c" stroke-width="2"/>
<text x="270.0" y="95.0" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#18332c">Two-layer residual loop</text>
<text x="135.0" y="427.0" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="normal" fill="#65736d">2</text>
<text x="227.0" y="427.0" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="normal" fill="#65736d">4</text>
