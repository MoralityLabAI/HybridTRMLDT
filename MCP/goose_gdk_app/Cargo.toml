[package]
name = "goblin-gdk"
version = "0.1.0"
edition = "2021"
description = "Pocket Goblin, a Goose GDK app: a goose-agent state machine whose context comes from the Data Goblin compact-packet MCP server, runnable one-shot or as an ACP agent for TitanAgent on OpenAB"
license = "MIT"
publish = false

[[bin]]
name = "goblin-gdk"
path = "src/main.rs"

[dependencies]
goose-agent = "=0.1.0-alpha.14"
goose-providers = "=0.1.0-alpha.14"
goose-provider-types = "=0.1.0-alpha.14"
rmcp = { version = "=3.11.0", default-features = false }
anyhow = "1"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
