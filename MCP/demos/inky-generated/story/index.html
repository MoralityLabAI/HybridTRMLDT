<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Lantern Hollow — A Choice of Three</title>
<style>
  :root{
    --ink:#0d0b1e;
    --paper:#f4ead8;
    --gold:#e8b64c;
    --teal:#2ec4b6;
    --rose:#e3645f;
    --violet:#7b5ea7;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:Georgia,'Times New Roman',serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:14px;
    gap:10px;
  }
  header{
    width:100%;
    max-width:1060px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(244,234,216,.25);
    padding-bottom:8px;
  }
  .title-block h1{
    font-size:1.35rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:normal;
  }
  .title-block p{
    font-size:.72rem;
    letter-spacing:.08em;
    color:rgba(244,234,216,.65);
    font-style:italic;
  }
  #restart{
    background:transparent;
    color:var(--paper);
    border:1px solid var(--gold);
    border-radius:6px;
    padding:8px 16px;
    font-family:inherit;
    font-size:.8rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    cursor:pointer;
    transition:all .2s;
  }
  #restart:hover{background:var(--gold);color:var(--ink);}
  #restart:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  main{
    width:100%;
    max-width:1060px;
    display:grid;
    grid-template-columns: 1fr 320px;
    gap:14px;
    align-items:stretch;
  }
  @media (max-width:900px){ main{grid-template-columns:1fr;} }
  .stage-wrap{
    position:relative;
    border:1px solid rgba(244,234,216,.3);
    border-radius:10px;
    overflow:hidden;
    background:#000;
    min-height:430px;
  }
  canvas{display:block;width:100%;height:100%;}
  .hud{
    position:absolute;
    left:0;right:0;bottom:0;
    padding:10px 14px;
    background:linear-gradient(transparent, rgba(0,0,0,.78));
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:10px;
    pointer-events:none;
  }
  .hud .scene-tag{
    font-size:.68rem;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--teal);
  }
  .hud .scene-tag b{color:var(--paper);font-weight:normal;}
  .hud .objective{
    font-size:.78rem;
    color:rgba(244,234,216,.85);
    font-style:italic;
    max-width:60%;
  }
  .panel{
    background:rgba(13,11,30,.82);
    border:1px solid rgba(244,234,216,.22);
    border-radius:10px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    backdrop-filter:blur(2px);
  }
  .panel h2{
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:normal;
    border-bottom:1px solid rgba(232,182,76,.35);
    padding-bottom:8px;
  }
  .panel .story{
    font-size:.92rem;
    line-height:1.45;
    min-height:96px;
    color:var(--paper);
  }
  .panel .story em{color:var(--gold);font-style:normal;}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background:rgba(244,234,216,.06);
    border:1px solid rgba(244,234,216,.28);
    border-radius:8px;
    padding:10px 12px;
    color:var(--paper);
    font-family:inherit;
    font-size:.86rem;
    cursor:pointer;
    transition:all .18s;
  }
  .choice .key{
    flex:0 0 30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid currentColor;
    border-radius:6px;
    font-size:.75rem;
    letter-spacing:.05em;
  }
  .choice:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold);}
  .choice:disabled{
    cursor:not-allowed;
    opacity:.38;
    border-style:dashed;
    border-color:rgba(244,234,216,.3);
    color:rgba(244,234,216,.55);
  }
  .choice:disabled .key{color:rgba(244,234,216,.5);}
  .choice.study{border-color:var(--teal);}
  .choice.study:hover:not(:disabled){border-color:var(--teal);background:rgba(46,196,182,.12);}
  .choice.cross{border-color:var(--gold);}
  .choice.cross:hover:not(:disabled){border-color:var(--gold);background:rgba(232,182,76,.12);}
  .choice.rush{border-color:var(--rose);}
  .choice.rush:hover:not(:disabled){border-color:var(--rose);background:rgba(227,100,95,.12);}
  .choice .sub{display:block;font-size:.68rem;color:rgba(244,234,216,.55);font-style:italic;margin-top:2px;}
  .choice.cross:disabled .sub{color:rgba(244,234,216,.4);}
  .hint{
    font-size:.68rem;
    color:rgba(244,234,216,.5);
    font-style:italic;
    line-height:1.4;
  }
  .hint b{color:var(--gold);font-weight:normal;}
  .log{
    margin-top:auto;
    border-top:1px solid rgba(244,234,216,.18);
    padding-top:8px;
    font-size:.72rem;
    line-height:1.5;
    color:rgba(244,234,216,.75);
    max-height:150px;
    overflow-y:auto;
  }
  .log div{margin-bottom:4px;}
  .log .t{color:var(--teal);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;}
  .log .good{color:var(--gold);}
  .log .bad{color:var(--rose);}
  .log .clue{color:var(--teal);}
  .log .sys{color:rgba(244,234,216,.5);font-style:italic;}
  .ending-banner{
    display:none;
    margin-top:6px;
    padding:8px 10px;
    border-radius:6px;
    font-size:.78rem;
    letter-spacing:.06em;
    text-align:center;
  }
  .ending-banner.good{display:block;background:rgba(232,182,76,.18);border:1px solid var(--gold);color:var(--gold);}
  .ending-banner.bad{display:block;background:rgba(227,100,95,.16);border:1px solid var(--rose);color:var(--rose);}
  .gamestate{
    font-size:.68rem;
    color:rgba(244,234,216,.55);
    font-family:ui-monospace,Menlo,monospace;
    word-break:break-all;
  }
  .gamestate b{color:var(--teal);font-weight:normal;}
  footer{
    width:100%;max-width:1060px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(244,234,216,.4);
    border-top:1px solid rgba(244,234,216,.15);
    padding-top:8px;
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>The Lantern Hollow</h1>
    <p>A choice of three — one clue, one lantern, one way home</p>
  </div>
  <button id="restart" type="button">Restart</button>
</header>

<main>
  <div class="stage-wrap">
    <canvas id="game" width="760" height="430" aria-label="Canvas scene of the Lantern Hollow"></canvas>
    <div class="hud">
      <div class="scene-tag">Scene <b id="sceneTag">1</b> / 5 &nbsp;·&nbsp; <b id="sceneName">The Hollow at Dusk</b></div>
      <div class="objective" id="objective">Find the way through the Hollow.</div>
    </div>
  </div>

  <aside class="panel" aria-label="Story and choices">
    <h2>Chronicle</h2>
    <p class="story" id="storyText"></p>
    <div class="choices" id="choices"></div>
    <div class="hint" id="hintText"></div>
    <div class="ending-banner" id="endingBanner"></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="gamestate">gameState() → <b id="gsScene">start</b> · clue: <b id="gsClue">none</b> · ending: <b id="gsEnding">null</b></div>
  </aside>
</main>

<footer>
  <span>Inky Web Game · inky-web-game</span>
  <span>Keyboard: 1 / 2 / 3 or click</span>
</footer>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const sceneTag=document.getElementById('sceneTag'),sceneName=document.getElementById('sceneName'),objective=document.getElementById('objective'),storyText=document.getElementById('storyText'),hintText=document.getElementById('hintText'),endingBanner=document.getElementById('endingBanner'),log=document.getElementById('log'),gsScene=document.getElementById('gsScene'),gsClue=document.getElementById('gsClue'),gsEnding=document.getElementById('gsEnding'),choices=document.getElementById('choices');
const restartBtn=document.getElementById('restart');
const W=canvas.width=640,H=canvas.height=360;
let state={scene:'start',clue:false,ending:null};
const scenes={
 start:{tag:'START',name:'The Lantern Hollow',obj:'Find the way through the hollow.',story:'A lantern flickers in the mist. The path splits before the old oak.',hint:'Study the hollow, or rush in blind.',ending:null,color:'#1b2a4a',sil:'#0d1526'},
 clue:{tag:'CLUE',name:'The Clue Room',obj:'Cross the lantern bridge.',story:'A carved lantern hums. The bridge hums back.',hint:'Cross now.',ending:null,color:'#3a2a12',sil:'#1a1206'},
 good:{tag:'GOOD ENDING',name:'The Lantern Keeper',obj:'You saved the hollow.',story:'The lantern burns steady. The hollow remembers your name.',hint:'',ending:'good',color:'#0f3a2a',sil:'#06231a'},
 bad:{tag:'BAD ENDING',name:'The Hollow Claims You',obj:'You were not ready.',story:'The mist swallows the path. The lantern dims to a whisper.',hint:'',ending:'bad',color:'#3a0f0f',sil:'#1f0606'}
};
function draw(){
 const s=scenes[state.scene];
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,s.color);g.addColorStop(1,'#000');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#f5d98a';ctx.beginPath();ctx.arc(W*0.72,H*0.28,34,0,7);ctx.fill();
 ctx.fillStyle=s.sil;
 ctx.beginPath();ctx.moveTo(0,H*0.62);ctx.lineTo(W*0.18,H*0.34);ctx.lineTo(W*0.34,H*0.62);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(W*0.3,H*0.62);ctx.lineTo(W*0.52,H*0.28);ctx.lineTo(W*0.74,H*0.62);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(W*0.62,H*0.62);ctx.lineTo(W*0.86,H*0.4);ctx.lineTo(W,H*0.62);ctx.closePath();ctx.fill();
 ctx.fillRect(0,H*0.62,W,H*0.38);
 ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,H*0.62,W,4);
 ctx.fillStyle='#f5d98a';ctx.beginPath();ctx.arc(W*0.5,H*0.78,10,0,7);ctx.fill();
 ctx.fillStyle='#000';ctx.beginPath();ctx.arc(W*0.5,H*0.78,6,0,7);ctx.fill();
}
function update(){
 const s=scenes[state.scene];
 sceneTag.textContent=s.tag;sceneName.textContent=s.name;objective.textContent=s.obj;storyText.textContent=s.story;hintText.textContent=s.hint;
 endingBanner.textContent=s.ending?(s.ending==='good'?'GOOD ENDING':'BAD ENDING'):'';
 gsScene.textContent=state.scene;gsClue.textContent=String(state.clue);gsEnding.textContent=state.ending||'null';
 log.textContent='scene='+state.scene+' clue='+state.clue+' ending='+(state.ending||'null');
 const bStudy=choices.querySelector('[data-choice="study"]'),bCross=choices.querySelector('[data-choice="cross"]'),bRush=choices.querySelector('[data-choice="rush"]');
 bStudy.disabled=false;bRush.disabled=false;
 bCross.disabled=!(state.scene==='clue');
 bCross.classList.toggle('disabled',bCross.disabled);
 bStudy.classList.toggle('disabled',false);
 bRush.classList.toggle('disabled',false);
}
function setScene(scene){state.scene=scene;draw();update();}
function makeButton(label,choice){
 const b=document.createElement('button');b.textContent=label;b.setAttribute('data-choice',choice);
 b.addEventListener('click',()=>{
  if(b.disabled)return;
  if(choice==='study'){state.clue=true;setScene('clue');}
  else if(choice==='cross'){state.ending='good';setScene('good');}
  else if(choice==='rush'){state.ending='bad';setScene('bad');}
 });
 choices.appendChild(b);
}
makeButton('Study the Hollow','study');
makeButton('Cross the Bridge','cross');
makeButton('Rush In Blind','rush');
restartBtn.addEventListener('click',()=>{state={scene:'start',clue:false,ending:null};draw();update();});
window.gameState=()=>JSON.parse(JSON.stringify(state));
draw();update();
</script>
</body></html>
