[project]
name = "hybrid-sequencer-v1"
description = "Verifiers v1 replay harness for topology-controlled TRM/LDT skill sequencers"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.1.14,<0.2",
]
tags = ["harness", "eval", "reasoning", "replay", "airis", "das"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "hybrid_sequencer_v1.py",
    "data/replay_tasks.jsonl",
    "data/airis_rules.json",
    "pyproject.toml",
    "README.md",
]

[tool.verifiers.eval]
num_examples = 50
rollouts_per_example = 1
