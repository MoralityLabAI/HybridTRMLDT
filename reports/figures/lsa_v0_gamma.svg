<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Loop Schedule Algebra kappa scaling</title>
  <desc id="desc">Tied kappa rises from 1.36 to 2.44 while untied kappa remains near one for rounds two, four, and eight.</desc>
  <rect width="760" height="440" fill="#f6f1e7"/>
  <text x="70" y="42" font-family="Georgia, serif" font-size="24" fill="#1f2d2a">Measured visit alignment</text>
  <text x="70" y="68" font-family="Georgia, serif" font-size="14" fill="#52615d">Geometric mean across three seeds; fixed state-visit exposure</text>
  <line x1="90" y1="360" x2="700" y2="360" stroke="#1f2d2a" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="360" stroke="#1f2d2a" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="12" fill="#52615d">
    <text x="82" y="365" text-anchor="end">0</text>
    <text x="82" y="275" text-anchor="end">1</text>
    <text x="82" y="185" text-anchor="end">2</text>
    <text x="82" y="95" text-anchor="end">3</text>
    <text x="170" y="382" text-anchor="middle">R=2</text>
    <text x="395" y="382" text-anchor="middle">R=4</text>
    <text x="620" y="382" text-anchor="middle">R=8</text>
  </g>
  <g stroke="#c8c0b1" stroke-width="1">
    <line x1="90" y1="270" x2="700" y2="270"/>
    <line x1="90" y1="180" x2="700" y2="180"/>
    <line x1="90" y1="90" x2="700" y2="90"/>
  </g>
  <polyline points="170,237.8 395,189.6 620,140.3" fill="none" stroke="#b6402c" stroke-width="4"/>
  <polyline points="170,272.2 395,269.7 620,269.0" fill="none" stroke="#176b68" stroke-width="4"/>
  <g fill="#b6402c" stroke="#f6f1e7" stroke-width="3">
    <circle cx="170" cy="237.8" r="7"/><circle cx="395" cy="189.6" r="7"/><circle cx="620" cy="140.3" r="7"/>
  </g>
  <g fill="#176b68" stroke="#f6f1e7" stroke-width="3">
    <circle cx="170" cy="272.2" r="7"/><circle cx="395" cy="269.7" r="7"/><circle cx="620" cy="269.0" r="7"/>
  </g>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="505" y="112" fill="#b6402c">tied: gamma=0.423, R^2=0.994</text>
    <text x="475" y="300" fill="#176b68">untied: gamma=0.026, R^2=0.903</text>
  </g>
  <text x="395" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#52615d">P1 tied interval [0.7,1.0] missed; untied interval [0.0,0.3] confirmed</text>
</svg>
