name: MOLT-GOBLIN-02 architecture factory and gym
on:
  pull_request:
    paths:
      - 'research_gym/molt_goblin_02/**'
      - '.github/workflows/molt-goblin-02.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy psutil
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q research_gym/molt_goblin_02
