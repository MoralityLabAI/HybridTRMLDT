name: MCP-09 development prospective planning
on:
  pull_request:
    paths:
      - 'MCP/mcp09/**'
      - '.github/workflows/mcp09.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: python -m unittest MCP.mcp09.test_planner -v
      - run: python -m pip install numpy scipy psutil torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m MCP.mcp09.smoke --seed 107 --capacity 32768 --out /tmp/mcp09/smoke/paired_32k.json
      - run: python -m MCP.mcp09.smoke --seed 107 --capacity 262144 --out /tmp/mcp09/smoke/paired_256k.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp09-development-smoke
          path: /tmp/mcp09/smoke/
          if-no-files-found: warn
