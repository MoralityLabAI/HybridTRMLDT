name: MCP-08 verifier-guided recursive search smoke
on:
  push:
    paths:
      - 'MCP/mcp08/**'
      - '.github/workflows/mcp08.yml'
  pull_request:
    paths:
      - 'MCP/mcp08/**'
      - '.github/workflows/mcp08.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy psutil torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m unittest MCP.mcp08.test_mcp08 -v
      - name: Smoke sweep with 256K memory, independent Storyworld, and cross-domain mechanistic probes
        run: |
          test -f MCP/results/mcp07/registered/checkpoints/107-recurrent_switch.pt
          python -m MCP.mcp08.gym --smoke --threads 4 --out /tmp/mcp08-smoke
          python -c "import json; s=json.load(open('/tmp/mcp08-smoke/summary.json')); m=json.load(open('/tmp/mcp08-smoke/mechanistic.json')); assert s['mode']=='smoke' and s['gates']['compute_gate']['status']=='PASS'; assert s['storyworld_summary']['witness_withheld_verified']; assert 'cross_domain_linear_probes' in m and 'cross_domain_activation_patching' in m"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp08-cpu-smoke-receipts
          path: /tmp/mcp08-smoke
          if-no-files-found: error
