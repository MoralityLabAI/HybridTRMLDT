name: MCP-05 Goose repair gym

on:
  pull_request:
    paths:
      - 'MCP/goose_gdk_app/**'
      - 'MCP/mcp02/**'
      - 'MCP/mcp03/**'
      - 'MCP/mcp05/**'
      - 'MCP/hubrun/mcp04.py'
      - '.github/workflows/mcp05.yml'
  workflow_dispatch:
    inputs:
      real_cpu_pilot:
        description: Run the frozen checkpoint on a prepared CPU-only runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 test --locked --manifest-path MCP/goose_gdk_app/Cargo.toml
      - run: cargo +1.99.0 build --locked --manifest-path MCP/goose_gdk_app/Cargo.toml
      - name: Deterministic provider, MCP stdio and revision invalidation
        run: |
          export GOBLIN_GDK_BINARY="$PWD/MCP/goose_gdk_app/target/debug/goblin-gdk"
          python -m unittest -v MCP.mcp05.test_mcp05
          python MCP/goose_gdk_app/ci_smoke.py "$GOBLIN_GDK_BINARY"
      - name: Native curriculum and matched CPU training
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m MCP.mcp05.gym --out /tmp/mcp05-suite --train 8 --test 3
          python -m MCP.mcp05.train --stage /tmp/mcp05-suite --out /tmp/mcp05-train --threads 4 --epochs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp05-controller-localization-cpu
          path: /tmp/mcp05-train/training.json
          if-no-files-found: error

  real-cpu-pilot:
    if: github.event_name == 'workflow_dispatch' && inputs.real_cpu_pilot
    runs-on: [self-hosted, linux, mcp05-cpu]
    needs: contracts
    timeout-minutes: 180
    env:
      CUDA_VISIBLE_DEVICES: ''
      MCP05_REAL_MODEL: ${{ vars.MCP05_REAL_MODEL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Evaluate a prepared loopback CPU endpoint
        run: |
          test -n "$MCP05_REAL_MODEL"
          cargo +1.99.0 build --locked --manifest-path MCP/goose_gdk_app/Cargo.toml
          python -m MCP.mcp05.gym --out "${RUNNER_TEMP}/mcp05-suite-$GITHUB_RUN_ID" --train 8 --test 3
          python -m MCP.mcp05.train --stage "${RUNNER_TEMP}/mcp05-suite-$GITHUB_RUN_ID" --out "${RUNNER_TEMP}/mcp05-train-$GITHUB_RUN_ID" --threads 4
          python -m MCP.mcp05.evaluate --stage "${RUNNER_TEMP}/mcp05-suite-$GITHUB_RUN_ID" --checkpoints "${RUNNER_TEMP}/mcp05-train-$GITHUB_RUN_ID" --out "${RUNNER_TEMP}/mcp05-real-$GITHUB_RUN_ID" --binary MCP/goose_gdk_app/target/debug/goblin-gdk --base-url http://127.0.0.1:8097/v1/ --model "$MCP05_REAL_MODEL" --arms A D --json-actions --limit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp05-real-cpu-receipts
          path: ${{ runner.temp }}/mcp05-real-${{ github.run_id }}/summary.json
          if-no-files-found: error
