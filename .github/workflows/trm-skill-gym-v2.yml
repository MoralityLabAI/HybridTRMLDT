name: TRM-SKILL-GYM-02 diagnostics
permissions:
  contents: read
on:
  push:
    paths:
      - 'research_gym/trm_skill_gym_v2/**'
      - 'tests/test_trm_skill_gym_v2*.py'
      - '.github/workflows/trm-skill-gym-v2.yml'
  pull_request:
    paths:
      - 'research_gym/trm_skill_gym_v2/**'
      - 'tests/test_trm_skill_gym_v2*.py'
      - '.github/workflows/trm-skill-gym-v2.yml'
  workflow_dispatch:
jobs:
  cpu-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy psutil pytest
      - run: python -m pytest -q tests/test_trm_skill_gym_v2.py tests/test_trm_skill_gym_v2_advanced.py
      - run: python -m research_gym.trm_skill_gym_v2.runner --out /tmp/skill02 --count 16 --seeds 0 --research-worlds 32 --shuffle-steps 8
      - run: python -m research_gym.trm_skill_gym_v2.race --out /tmp/skill02/race --skills deduction --seeds 10 --steps 2 --count 8 --train-count 64 --max-archive 1
      - run: python -m research_gym.trm_skill_gym_v2.advanced --out /tmp/skill02/advanced --count 64 --nulls 4
      - uses: actions/upload-artifact@v4
        with:
          name: skill02-diagnostics
          path: /tmp/skill02/

  cpu-fresh-race:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install numpy psutil
      - run: python -m research_gym.trm_skill_gym_v2.race --out /tmp/skill02-race --skills deduction retrieval --seeds 10 11 --steps 120 --count 64 --train-count 512 --max-archive 3 --hours 0.45 --job-seconds 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill02-fresh-race
          path: /tmp/skill02-race/
