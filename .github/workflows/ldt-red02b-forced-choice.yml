name: LDT-RED02-B pinned Qwen05 forced-choice action scoring on typed host

on:
  push:
    branches:
      - "research/ldt-red02b-choice-*"
    paths:
      - ".github/workflows/ldt-red02b-forced-choice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-forced-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MODEL_DIR: /tmp/ldt_red02b_qwen05
      META_PATH: /tmp/ldt_red02b_metadata.json
      RAW_PATH: /tmp/ldt_red02b_forced_raw.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded CPU model requirements
        run: python -m pip install "torch==2.5.1" "transformers==4.51.3" "huggingface_hub==0.30.2" "numpy>=1.26,<3"
      - name: Verify distinct post-RED02A source and original model hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          root=Path('research_gym/benchmarks/ldt_adversarial_depth_gym')
          lock=json.loads((root/'RED02_B_LOCK.json').read_text())
          assert lock['registration']=='POST_A_FREE_GENERATION_FAILURE_PRE_B_ACTION_SCORE_RUN'
          assert lock['revision']=='7ae557604adf67be50417f59c2c2f167def9a775'
          assert lock['two_excluded_roots']==[901,902] and lock['depths']==[2,8]
          assert lock['ranking']=='mean autoregressive logprob of fixed valid JSON completion per candidate'
          for path,sha in lock['source'].items():
              got=subprocess.check_output(['git','hash-object',str(root/path)],text=True).strip()
              assert got==sha,(path,got,sha)
          for path,sha in lock['upstream_source'].items():
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert got==sha,(path,got,sha)
          print('LDT-RED02-B source lock verified; first free-text negative receipt untouched')
          PY
      - name: Four pure fixed-schema action-scoring tests
        run: python -m unittest research_gym.benchmarks.ldt_adversarial_depth_gym.test_red02_forced_choice -v
      - name: Download unchanged pinned model and compute original weight hashes
        run: |
          python -m research_gym.benchmarks.ldt_adversarial_depth_gym.red02_live_ci \
            --download --local-model "$MODEL_DIR" --metadata "$META_PATH"
      - name: Verify full model and tokenizer bytes against RED02-A before any inference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path('research_gym/benchmarks/ldt_adversarial_depth_gym')
          lock=json.loads((root/'RED02_B_LOCK.json').read_text())
          meta=json.loads(Path(os.environ['META_PATH']).read_text())
          assert meta['pinned_revision']==lock['revision']
          assert meta['weight_files']['model.safetensors']['sha256']==lock['model_safetensors_sha256']
          assert meta['tokenizer_sha256']==lock['tokenizer_sha256']
          print('REAL QWEN HISTORICAL MODEL WEIGHT/TOKENIZER SHA MATCH RED02-A')
          PY
      - name: Score eight real Qwen candidate actions at every fictional world turn
        run: |
          python -m research_gym.benchmarks.ldt_adversarial_depth_gym.red02_forced_choice \
            --local-model "$MODEL_DIR" --metadata "$META_PATH" --out "$RAW_PATH"
      - name: Check model-ranked proposals, host authority and exact utility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,math
          x=json.loads(Path(os.environ['RAW_PATH']).read_text())
          assert x['experiment']=='LDT-RED02-B'
          assert x['forced_action_grammar'] and not x['free_text_generation']
          assert x['roots']==[901,902] and x['depths']==[2,8]
          assert len(x['episodes'])==4
          assert sum(len(row['choices']) for row in x['model_choices'])==20
          assert sum(e['malformed_red_messages'] for e in x['episodes'])==0
          for episode in x['episodes']:
              assert episode['red_executions']==0 and episode['host_violations']==0
              assert episode['host_optimum_utility']>=episode['terminal']['scalar_for_host']
              print('RED02B_MODEL='+json.dumps({
                  'root':episode['world_root'],'depth':episode['horizon'],
                  'attempts':episode['red_attempts'],'blocked':episode['blocked'],
                  'host_violations':episode['host_violations'],
                  'regret':episode['utility_regret'],
                  'ending':episode['terminal']['ending']}))
          for episode in x['model_choices']:
              for item in episode['choices']:
                  assert len(item['scores'])==8
                  assert all(math.isfinite(v) for v in item['scores'].values())
          print('QWEN RED02-B scored real model-preferences in an exact host-controlled fictional environment')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ldt-red02b-pinned-real-qwen05-forced-choice-raw
          path: |
            /tmp/ldt_red02b_metadata.json
            /tmp/ldt_red02b_forced_raw.json
          if-no-files-found: warn
