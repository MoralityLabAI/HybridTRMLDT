name: Goose GDK app

on:
  pull_request:
    paths:
      - 'MCP/goose_gdk_app/**'
      - 'MCP/GDK/**'
      - 'MCP/mcp03/**'
      - '.github/workflows/goose-gdk-app.yml'
  push:
    branches: [master]
    paths:
      - 'MCP/goose_gdk_app/**'
      - 'MCP/GDK/**'
      - 'MCP/mcp03/**'
      - '.github/workflows/goose-gdk-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MCP/goose_gdk_app
      - name: Test GDK-01 provider view and byte preflight
        working-directory: MCP/goose_gdk_app
        run: cargo test --locked
      - name: Build debug smoke binary
        working-directory: MCP/goose_gdk_app
        run: cargo build --locked
      - name: Goblin MCP server and GDK app against a scripted OpenAI-compatible endpoint
        run: python MCP/goose_gdk_app/ci_smoke.py MCP/goose_gdk_app/target/debug/goblin-gdk
      - name: GDK-02 Inkling and Bonsai exact-gate scripted smoke
        run: python MCP/goose_gdk_app/ci_gdk02_smoke.py MCP/goose_gdk_app/target/debug/goblin-gdk
      - name: Build release against goose-agent 0.1.0-alpha.14
        working-directory: MCP/goose_gdk_app
        run: cargo build --release --locked
