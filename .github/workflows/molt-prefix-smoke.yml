name: MoLT hybrid exact prefix fixture
on:
  pull_request:
    paths:
      - 'research_gym/benchmarks/molt_hybrid/**'
      - '.github/workflows/molt-prefix-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s research_gym/benchmarks/molt_hybrid -p 'test_*.py' -v
