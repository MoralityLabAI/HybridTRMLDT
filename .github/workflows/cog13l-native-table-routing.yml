name: COG-13L native table-backed routing
on:
  pull_request:
    paths:
      - 'experiments/cog13l_native_table_routing/**'
      - '.github/workflows/cog13l-native-table-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
      MATHLIB_SHA: 56a005855ea17e0b0958f73ec801ae140b0a1679
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve pinned source and prior cohort archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for entry in '15136527625 c.zip d99bc6a95d4ea31a132b408cd653644e9680a167fa87aca3b722522af0ab5aea' '15139420524 h.zip f20b8ce3b6f1fe6d8e12816899024027c921bcb2065ddefd6c578c7d4ec80f8d' '15160808431 j.zip 624fd661c820796d0db786aab6ce585d575bc0524db25fdb0b76b2d3f86fba69'; do
            read -r id name digest <<< "$entry"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/MoralityLabAI/HybridTRMLDT/actions/artifacts/$id/zip" \
              -o "$RUNNER_TEMP/$name"
            echo "$digest  $RUNNER_TEMP/$name" | sha256sum --check
          done
      - name: Compile receiver and exercise frozen mock search
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cog13l"
          python experiments/cog13l_native_table_routing/run.py "$RUNNER_TEMP/c.zip" \
            --fixture --out "$RUNNER_TEMP/cog13l/fixture"
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/mathlib4
          ref: 56a005855ea17e0b0958f73ec801ae140b0a1679
          path: upstream-mathlib
          persist-credentials: false
      - name: Install Lean 4.35.0
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib and exact snapshot server
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.35.0"
          lean --version
          lake exe cache get
          cp "$GITHUB_WORKSPACE/experiments/cog13j_native_progressive/StateCacheJ.lean" .
          mkdir -p .lake/build/lib/lean
          lake env lean -o .lake/build/lib/lean/StateCacheJ.olean StateCacheJ.lean
      - name: Run fresh paired native benchmark
        working-directory: upstream-mathlib
        run: |
          set -euo pipefail
          lake env bash -c '
            python "$GITHUB_WORKSPACE/experiments/cog13l_native_table_routing/run.py" \
              "$RUNNER_TEMP/c.zip" --old-h "$RUNNER_TEMP/h.zip" --old-j "$RUNNER_TEMP/j.zip" \
              --lean "$(command -v lean)" --cwd "$PWD" --out "$RUNNER_TEMP/cog13l/native"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog13l-native-and-fixture
          path: ${{ runner.temp }}/cog13l/
          if-no-files-found: warn
          retention-days: 30
