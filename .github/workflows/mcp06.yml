name: MCP-06 spatial memory smoke
on:
  push:
    paths:
      - 'MCP/mcp06/**'
      - '.github/workflows/mcp06.yml'
  pull_request:
    paths:
      - 'MCP/mcp06/**'
      - '.github/workflows/mcp06.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: python -m pip install numpy torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m unittest MCP.mcp06.test_gym -v
      - name: Smoke with native archived witness
        run: |
          test -f MCP/results/mcp05/inky-hilbert-16k/storyworld.hilbert.json
          python -m MCP.mcp06.gym --smoke --threads 2 --out /tmp/mcp06-smoke
          python -c "import json; s=json.load(open('/tmp/mcp06-smoke/summary.json')); assert s['native_status']=='witness_replay_only' and all(e['swap_control_verified'] for a in s['native'] for e in a['results']); assert len(s['native'])==6"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp06-cpu-smoke-receipts
          path: /tmp/mcp06-smoke
          if-no-files-found: error
