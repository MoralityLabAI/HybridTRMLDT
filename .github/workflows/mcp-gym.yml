name: MCP retrieval gym

on:
  pull_request:
    paths:
      - 'MCP/**'
      - 'research_gym/core/**'
      - '.github/workflows/mcp-gym.yml'
      - 'pyproject.toml'
  push:
    branches: [master]
    paths:
      - 'MCP/**'
      - 'research_gym/core/**'
      - '.github/workflows/mcp-gym.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: MCP contracts and lattice regressions
        run: >-
          python -m pytest -q MCP tests/test_cca_verified_membrane.py tests/test_hybrid_membrane.py
          --ignore=MCP/mcp06 --ignore=MCP/mcp07 --ignore=MCP/mcp08 --ignore=MCP/test_spatial_mms.py
      - name: Matched deterministic MCP stdio pilot
        run: python -m MCP.run --controller reference --transport stdio --cases 24 --catalog-sizes 8 64 --depths 3 --out MCP/runs/ci
      - name: MCP-02 deterministic control smoke, summary and tape replay
        run: |
          python -m MCP.mcp02.run evaluate --config MCP/mcp02/configs/smoke_cpu.json --controls-only --out MCP/runs/mcp02-ci
          python -m MCP.mcp02.run summarize --run MCP/runs/mcp02-ci
          python -m MCP.mcp02.run replay --run MCP/runs/mcp02-ci
      - name: MCP-02 torch-free replay of committed pilot tapes
        run: |
          for run in MCP/results/mcp02/*/; do
            if [ -f "$run/run_config.json" ]; then python -m MCP.mcp02.run replay --run "$run" --every 15; fi
          done
      - name: Preserve fixture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-fixture-receipts
          path: |
            MCP/runs/ci
            MCP/runs/mcp02-ci
          if-no-files-found: warn
          retention-days: 14
