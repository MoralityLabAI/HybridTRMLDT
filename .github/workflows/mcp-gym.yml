name: MCP retrieval gym

on:
  pull_request:
    paths:
      - 'MCP/**'
      - 'research_gym/core/**'
      - '.github/workflows/mcp-gym.yml'
      - 'pyproject.toml'
  push:
    branches: [master]
    paths:
      - 'MCP/**'
      - 'research_gym/core/**'
      - '.github/workflows/mcp-gym.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: MCP contracts and lattice regressions
        run: python -m pytest -q MCP tests/test_cca_verified_membrane.py tests/test_hybrid_membrane.py
      - name: Matched deterministic MCP stdio pilot
        run: python -m MCP.run --controller reference --transport stdio --cases 24 --catalog-sizes 8 64 --depths 3 --out MCP/runs/ci
      - name: Preserve fixture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-01-fixture-receipts
          path: MCP/runs/ci
          if-no-files-found: warn
          retention-days: 14
