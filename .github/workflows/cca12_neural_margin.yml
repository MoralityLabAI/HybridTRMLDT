name: CCA-12 neural robustness

on:
  push:
    branches: [master]
    paths:
      - 'research_gym/core/cca_neural_margins.py'
      - 'tests/test_cca_neural_margins.py'
      - 'experiments/cca12_neural_robustness/**'
      - 'docs/cca12_neural_robustness.md'
      - '.github/workflows/cca12_neural_margin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-real-six-tape-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Exhaustive small-head margin/witness regression
        run: python -m pytest -q tests/test_cca_neural_margins.py
      - name: Run SHA-verified six-tape neural-output audit
        run: python experiments/cca12_neural_robustness/run_tapes.py --out /tmp/cca12_real_tapes.json
      - name: Write pass-four evidence table
        run: |
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/cca12_real_tapes.json'))
          lines=["### CCA-12A: actual recorded TRM logits (pass 4)",
                 "| Checkpoint | Raw unsafe / 1750 | Safe choices guaranteed for eps=0.1 | Worst-case unsafe at eps=0.1 | Shield unsafe |",
                 "|---|---:|---:|---:|---:|"]
          for tag, v in sorted(r["checkpoints"].items()):
              m=v["split_pass_metrics"]["all"]["4"]
              lines.append(f'| {tag} | {m["raw_unsafe"]} | {m["guaranteed_safe_count"]["0.1"]} | {m["worst_case_unsafe_count"]["0.1"]} | {m["shield_unsafe_count"]["0.1"]} |')
          lines.append("")
          lines.append("### Exploratory CCA-W: lowest possible shielded utility")
          lines.append("| Checkpoint | Worst-case shield utility at eps=0.1 | Certified oracle utility |")
          lines.append("|---|---:|---:|")
          for tag, v in sorted(r["checkpoints"].items()):
              m=v["split_pass_metrics"]["all"]["4"]
              lines.append(f'| {tag} | {m["worst_case_safe_utility_mean_viable"]["0.1"]:.6f} | {m["oracle_utility_mean_viable"]["0.1"]:.6f} |')
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf8") as f:
              f.write("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cca12-actual-six-tapes
          path: /tmp/cca12_real_tapes.json
