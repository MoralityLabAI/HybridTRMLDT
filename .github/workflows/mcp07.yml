name: MCP-07 adaptive geometry smoke
on:
  push:
    paths:
      - 'MCP/mcp07/**'
      - '.github/workflows/mcp07.yml'
  pull_request:
    paths:
      - 'MCP/mcp07/**'
      - '.github/workflows/mcp07.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy psutil torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m unittest MCP.mcp07.test_mcp07 -v
      - name: Smoke sweep with native witness replay and route discovery
        run: |
          test -f MCP/results/mcp05/inky-hilbert-16k/storyworld.hilbert.json
          python -m MCP.mcp07.gym --smoke --threads 4 --out /tmp/mcp07-smoke
          python -c "import json; s=json.load(open('/tmp/mcp07-smoke/summary.json')); n=json.load(open('/tmp/mcp07-smoke/native_storyworld.json')); m=json.load(open('/tmp/mcp07-smoke/mechanistic.json')); assert s['mode']=='smoke' and s['native_status']=='completed_separate_from_synthetic'; assert n['independent_route_discovery']['witness_withheld_verified']; assert all(e['swap_control_verified'] for r in n['archived_witness_replay'] for e in r['endings']); assert 'pooled_interventions' in m"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp07-cpu-smoke-receipts
          path: /tmp/mcp07-smoke
          if-no-files-found: error
